            uSteps: { value: 3.0 }, // จำนวนระดับแสง

        vertexShader: `
            varying vec3 vNormal;
            varying vec3 vPosition;
            void main() {
            vNormal = normalize(normalMatrix * normal);
            vPosition = (modelViewMatrix * vec4(position, 1.0)).xyz;
            gl_Position = projectionMatrix * vec4(vPosition, 1.0);
            }

            uniform vec3 uLightDirection;
            uniform vec3 uColor;
            uniform float uSteps;
            varying vec3 vNormal;
            varying vec3 vPosition;

            void main() {
            // คำนวณทิศทางแสงกับ normal
            float light = dot(normalize(vNormal), normalize(uLightDirection));
            light = clamp(light, 0.0, 1.0);

            // quantize เงาเป็นขั้น ๆ
            float level = floor(light * uSteps) / (uSteps - 1.0);
            vec3 color = uColor * level;

            gl_FragColor = vec4(color, 1.0);
            }
        `,

        // คลิกที่ Mesh ที่กำหนดแล้วหมุนกล้อง
        const clickable = [];

        function addObj(mesh, pos, name) {
            mesh.position.copy(pos);
            mesh.name = name;
            scene.add(mesh);
            clickable.push(mesh);
            return mesh;
        }

        // --- พรีเซ็ตตำแหน่งกล้องต่อวัตถุ ---
        const VIEWS = {
            Press: { pos: new THREE.Vector3(9, 4, -4), tar: new THREE.Vector3(4, 2, -3) },
            Backhome: { pos: new THREE.Vector3(0, 3, 9), tar: new THREE.Vector3(0, 0, 0) },

        };

        // --- Raycaster + คลิกเพื่อสลับมุม ---
        const raycaster = new THREE.Raycaster();
        const pointer = new THREE.Vector2();

        function setPointer(e) {
            const r = renderer.domElement.getBoundingClientRect();
            const x = (e.clientX ?? e.touches[0].clientX) - r.left;
            const y = (e.clientY ?? e.touches[0].clientY) - r.top;
            pointer.x = (x / r.width) * 2 - 1;
            pointer.y = -(y / r.height) * 2 + 1;
        }

        let activeView = null;
        let isMoving = false;
        let moveProgress = 0;

        function onPick(e) {
            setPointer(e);
            raycaster.setFromCamera(pointer, camera);
            const hit = raycaster.intersectObjects(clickable, true)[0];
            if (!hit) return;

            // 🔍 หา parent ที่มีชื่ออยู่ใน VIEWS
            let obj = hit.object;
            while (obj && !VIEWS[obj.name]) {
                obj = obj.parent;
            }
            if (!obj) return;

            const view = VIEWS[obj.name];
            activeView = view;
            isMoving = true;
            moveProgress = 0;
            controls.enabled = false;
        }

        renderer.domElement.addEventListener('click', onPick);
        renderer.domElement.addEventListener('touchend', onPick, { passive: true });

        // --- Resize ---
        addEventListener('resize', () => {
            camera.aspect = innerWidth / innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(innerWidth, innerHeight);
        });

        // --- Render Loop ---
        function loop() {
            requestAnimationFrame(loop);

            if (isMoving && activeView) {
                moveProgress += 0.03;

                // เลื่อนตำแหน่งและเป้าหมายกล้องเข้าหา view ใหม่
                camera.position.lerp(activeView.pos, 0.05);
                controls.target.lerp(activeView.tar, 0.05);
                controls.update();

                // ตรวจสอบว่ากล้องมาถึงแล้วหรือยัง
                const dist = camera.position.distanceTo(activeView.pos);
                const focusDist = controls.target.distanceTo(activeView.tar);
                if (dist < 0.05 && focusDist < 0.05) {
                    // ถึงแล้ว ปลดล็อก
                    isMoving = false;
                    activeView = null;
                    controls.enabled = true; // กลับมาให้หมุนกล้องได้
                }
            }

            controls.update();
            renderer.render(scene, camera);
        }
        loop();

    </script>
</body>
</html>
